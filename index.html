<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borzikkk95 — NFT Card</title>
<meta name="description" content="Меню, Instagram и Telegram">
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:22px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:#fff;background:
 radial-gradient(circle at 50% 0%,#343434 0%,#151515 38%,#080808 100%);
}
.card{
 width:min(100%,430px);padding:34px 22px 26px;text-align:center;
 border:1px solid rgba(255,255,255,.16);border-radius:30px;
 background:rgba(255,255,255,.075);backdrop-filter:blur(20px);
 box-shadow:0 30px 90px rgba(0,0,0,.55);
}
.logo{
 width:88px;height:88px;margin:0 auto 18px;border-radius:25px;
 display:grid;place-items:center;background:linear-gradient(145deg,#fff,#bdbdbd);
 color:#111;font-size:25px;font-weight:900;letter-spacing:-1px;
 box-shadow:0 10px 35px rgba(255,255,255,.12);
}
h1{margin:0;font-size:28px;letter-spacing:-.5px}
.handle{margin:7px 0 25px;color:rgba(255,255,255,.58);font-size:14px}
.links{display:grid;gap:12px}
a{
 min-height:60px;display:flex;align-items:center;justify-content:center;
 gap:10px;border-radius:18px;text-decoration:none;color:#111;
 background:#fff;font-size:16px;font-weight:750;
 transition:.18s ease;box-shadow:0 8px 25px rgba(0,0,0,.18);
}
a:hover{transform:translateY(-2px);filter:brightness(.94)}
.icon{font-size:21px}
.note{margin-top:23px;font-size:11px;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<main class="card">
  <div class="logo">B95</div>
  <h1>Borzikkk95</h1>
  <div class="handle">Digital NFT Card</div>

  <div class="links">
    <a href="https://agmessr.github.io/Ages-/" target="_blank" rel="noopener noreferrer">
      <span class="icon">🍽️</span> Меню
    </a>
    <a href="https://t.me/borzikkk95" target="_blank" rel="noopener noreferrer">
      <span class="icon">💬</span> Telegram
    </a>
    <a href="https://www.instagram.com/borzikkk_95/" target="_blank" rel="noopener noreferrer">
      <span class="icon">📸</span> Instagram
    </a>
  </div>

  <div class="note">One card · Three destinations</div>
</main>
</body>
</html>
